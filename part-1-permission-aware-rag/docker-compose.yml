name: permission-aware-rag-part1

services:
  pgvector:
    # Pin an exact version (never :latest) so every student runs the same build.
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: rag-pgvector
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "raglab"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_password"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raglab"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  rag-api:
    build:
      context: ./rag-api
    container_name: rag-api
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      RAG_AUTH: "${RAG_AUTH:-false}"
      RAG_ACL: "${RAG_ACL:-false}"
      RAG_IDENTITY: "${RAG_IDENTITY:-false}"
      RAG_RLS: "${RAG_RLS:-false}"
      RAG_SANITIZE: "${RAG_SANITIZE:-false}"
      DB_HOST: "pgvector"
      DB_NAME: "raglab"
      DB_ADMIN_USER: "postgres"
      DB_ADMIN_PASSWORD_FILE: "/run/secrets/postgres_password"
      DB_APP_USER: "rag_app"
      DB_APP_PASSWORD_FILE: "/run/secrets/db_app_password"
    volumes:
      - ./corpus:/app/corpus:ro
    secrets:
      - postgres_password
      - db_app_password
      - token_alice
      - token_bob
      - token_carol
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [internal]

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  db_app_password:
    file: ./secrets/db_app_password.txt
  token_alice:
    file: ./secrets/token_alice.txt
  token_bob:
    file: ./secrets/token_bob.txt
  token_carol:
    file: ./secrets/token_carol.txt

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
